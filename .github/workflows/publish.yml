name: Publish Extension

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: verify tokens but skip publishing"
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Check tag matches package.json version
        if: github.event_name == 'release'
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG="${{ github.event.release.tag_name }}"
          if [ "v$PKG_VERSION" != "$TAG" ]; then
            echo "::error::Release tag $TAG does not match package.json version v$PKG_VERSION"
            exit 1
          fi

      - name: Package extension
        run: npx @vscode/vsce package

      - name: Upload .vsix as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: "*.vsix"

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: write # to attach the .vsix to the GitHub release
    env:
      # Publish for real only on a release, or a manual run with dry_run unchecked
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download .vsix artifact
        uses: actions/download-artifact@v4
        with:
          name: vsix

      - name: Verify marketplace tokens (dry run)
        if: env.DRY_RUN == 'true'
        run: |
          npx @vscode/vsce verify-pat anilkir
          npx ovsx verify-pat anilkir
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Publish to VS Code Marketplace
        if: env.DRY_RUN != 'true'
        run: npx @vscode/vsce publish --packagePath ./*.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX (Cursor)
        if: env.DRY_RUN != 'true'
        run: npx ovsx publish ./*.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Attach .vsix to GitHub release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" ./*.vsix --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
